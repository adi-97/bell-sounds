<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a1712">
<meta name="description" content="Ring temple bells by tapping, swiping or shaking your phone.">
<title>Bell Sounds</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="brass" x1="0" x2="1">
      <stop offset="0" stop-color="#8a5a10"/>
      <stop offset=".35" stop-color="#ffe08a"/>
      <stop offset=".55" stop-color="#e0a93a"/>
      <stop offset="1" stop-color="#7a4c0c"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" x2="1">
      <stop offset="0" stop-color="#6e450a"/>
      <stop offset=".4" stop-color="#f1c45c"/>
      <stop offset="1" stop-color="#6e450a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#9a650c"/>
      <stop offset=".3" stop-color="#ffeeb0"/>
      <stop offset=".55" stop-color="#f2c04a"/>
      <stop offset="1" stop-color="#835409"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2000" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="mouth" cx=".5" cy=".2" r=".8">
      <stop offset="0" stop-color="#1e1003"/>
      <stop offset="1" stop-color="#6b4410"/>
    </radialGradient>
    <linearGradient id="copper" x1="0" x2="1">
      <stop offset="0" stop-color="#7a3d12"/>
      <stop offset=".38" stop-color="#f5b878"/>
      <stop offset=".6" stop-color="#c97a3a"/>
      <stop offset="1" stop-color="#6a3410"/>
    </linearGradient>
  </defs>
</svg>

<main>
  <header>
    <h1>Bell Sounds</h1>
    <p>Tap the bell, swipe it back and forth, or shake your phone.</p>
    <button id="gearBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div id="stage" tabindex="0" role="button" aria-label="Ring the bell. Tap, swipe, or press Space.">
    <div id="glow"></div>
    <div id="pendulum">
      <div id="chain"></div>
      <svg id="bell" viewBox="0 0 120 150" aria-hidden="true"></svg>
    </div>
    <div id="hint">Tap or swipe here</div>
  </div>

  <div class="row">
    <button class="btn primary" id="ringBtn">Ring once</button>
  </div>

</main>

<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="dlg-head">
    <h2 id="settingsTitle">⚙️ Settings</h2>
    <button id="closeBtn" aria-label="Close settings">×</button>
  </div>
  <section class="group" aria-labelledby="bellGroup">
    <h3 id="bellGroup">Bell settings</h3>
    <div class="setting"><span>Bell</span><div id="bells"></div></div>
    <div class="setting"><span>Volume</span><div class="seg" data-key="vol"></div></div>
    <div class="setting"><span>Echo</span><div class="seg" data-key="rev"></div></div>
  </section>

  <section class="group" aria-labelledby="modeGroup">
    <h3 id="modeGroup">Ringing modes</h3>
    <div class="setting"><span>Ring continuously</span><div class="seg" id="aartiSeg">
      <button data-on="off" aria-pressed="true">Off</button><button data-on="on" aria-pressed="false">On</button>
    </div></div>
    <div class="setting"><span>Continuous speed</span><div class="seg" data-key="speed"></div></div>
    <div class="setting"><span>📳 Shake to ring</span><div class="seg" id="shakeSeg">
      <button data-shake="off" aria-pressed="true">Off</button><button data-shake="on" aria-pressed="false">On</button>
    </div><p id="status"></p></div>
    <div class="setting"><span>Shake sensitivity</span><div class="seg" data-key="sens"></div></div>
  </section>
</dialog>

<script src="js/settings.js" defer></script>
<script src="js/bells.js" defer></script>
<script src="js/audio.js" defer></script>
<script src="js/animation.js" defer></script>
<script src="js/shake.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
